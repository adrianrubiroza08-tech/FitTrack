{% extends "base.html" %}

{% block title %}FitTrack - Verify Email{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-6 col-lg-5">

            <div class="text-center mb-4">

                <h1 class="fw-bold">Verify Your Email</h1>

                <p class="text-muted">
                    We sent a 6-digit verification code to your email.
                </p>

            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <div class="mb-4">

                            <label
                                for="otp"
                                class="form-label">
                                Verification Code
                            </label>

                            <input
                                type="text"
                                name="otp"
                                id="otp"
                                class="form-control text-center"
                                maxlength="6"
                                minlength="6"
                                inputmode="numeric"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Verify Email
                        </button>

                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Check your Gmail inbox for the verification code.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
