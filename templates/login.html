{% extends "base.html" %}

{% block title %}FitTrack - Login{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-6 col-lg-5">

            <div class="text-center mb-4">

                <h1 class="fw-bold">Welcome Back</h1>

                <p class="text-muted">
                    Login to continue to your FitTrack account.
                </p>

            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    {% if error %}

                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>

                    {% endif %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">

                        Don't have an account?

                        <a
                            href="{{ url_for('auth.register') }}"
                            class="text-decoration-none fw-semibold">
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
