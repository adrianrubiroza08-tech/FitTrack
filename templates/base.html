<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FitTrack{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
            href="{% if session.get('user_id') %}{{ url_for('dashboard.dashboard_page') }}{% else %}{{ url_for('home') }}{% endif %}">

           <img src="{{ url_for('static', filename='css/images/FTLogo.png') }}" 
           alt="FitTrack Logo"
           height="35"
           class="me-2"
           >

            FitTrack
        </a>

        {% if session.get("user_id") %}

            <div class="dropdown">

                <button
                    class="btn btn-outline-light dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                    👤 {{ session.get("user_name") }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item"
                           href="{{ url_for('profile.profile_page') }}">
                            👤 View Profile
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item"
                           href="{{ url_for('profile.change_password') }}">
                            🔒 Change Password
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item text-danger"
                           href="{{ url_for('auth.logout') }}">
                             ⍈ Logout
                        </a>
                    </li>

                </ul>

            </div>

        {% endif %}

    </div>
</nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='css/js/script.js') }}"></script>

</body>
</html>
