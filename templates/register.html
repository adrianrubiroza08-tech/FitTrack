{% extends "base.html" %}

{% block title %}FitTrack - Register{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-7 col-lg-6">

            <div class="text-center mb-4">

                <h1 class="fw-bold">Create Your Account</h1>

                <p class="text-muted">
                    Join FitTrack and start tracking your workouts.
                </p>

            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    {% if error %}

                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>

                    {% endif %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="first_name"
                                    class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    name="first_name"
                                    id="first_name"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="last_name"
                                    class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    name="last_name"
                                    id="last_name"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                            <div class="form-text">
                                Password must be at least 8 characters.
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Create Account
                        </button>

                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">

                        Already have an account?

                        <a
                            href="{{ url_for('auth.login') }}"
                            class="text-decoration-none fw-semibold">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
