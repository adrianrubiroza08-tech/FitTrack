{% extends "base.html" %}

{% block title %}FitTrack - Log Workout{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-4">
                <h1 class="fw-bold">Log New Workout</h1>

                <p class="text-muted">
                    Record your workout and start tracking your progress.
                </p>
            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    {% if error %}

                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>

                    {% endif %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="source"
                            value="{{ source }}"
                        >

                        <div class="mb-3">

                            <label for="workout_name"
                                   class="form-label">
                                Workout Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="workout_name"
                                name="workout_name"
                                placeholder="e.g. Push Day"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label for="workout_date"
                                   class="form-label">
                                Workout Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="workout_date"
                                name="workout_date"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label for="notes"
                                   class="form-label">
                                Notes
                            </label>

                            <textarea
                                class="form-control"
                                id="notes"
                                name="notes"
                                rows="5"
                                placeholder="Add any notes about your workout..."
                            ></textarea>

                        </div>

                        <div class="d-flex flex-wrap gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Save Workout
                            </button>

                            <a
                                href="{% if source == 'workouts' %}{{ url_for('workout.workouts') }}{% else %}{{ url_for('dashboard.dashboard_page') }}{% endif %}"
                                class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
