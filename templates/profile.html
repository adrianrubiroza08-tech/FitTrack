{% extends "base.html" %}

{% block title %}FitTrack - My Profile{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-4">

                <h1 class="fw-bold">My Profile</h1>

                <p class="text-muted">
                    View and update your account information.
                </p>

            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <!-- First Name -->

                        <div class="mb-3">

                            <label
                                for="first_name"
                                class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                id="first_name"
                                class="form-control"
                                value="{{ user.first_name }}"
                                required
                            >

                        </div>


                        <!-- Last Name -->

                        <div class="mb-3">

                            <label
                                for="last_name"
                                class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                id="last_name"
                                class="form-control"
                                value="{{ user.last_name }}"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                value="{{ user.email }}"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">
                            Save Changes
                        </button>

                    </form>

                </div>

            </div>


            <!-- Account Actions -->

            <div class="card shadow-sm mt-4">

                <div class="card-body">

                    <h5 class="fw-bold">
                        Account Settings
                    </h5>

                    <p class="text-muted">
                        Manage your account security.
                    </p>

                    <a
                        href="{{ url_for('profile.change_password') }}"
                        class="btn btn-outline-primary">
                        Change Password
                    </a>

                </div>

            </div>


            <div class="mt-4">

                <a
                    href="{{ url_for('dashboard.dashboard_page') }}"
                    class="btn btn-outline-secondary">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
